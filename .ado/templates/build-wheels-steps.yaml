steps:
- task: UsePythonVersion@0
  displayName: Install Python
  inputs:
    versionSpec: "$(pythonVersion)"

- task: RustInstaller@1
  inputs:
    rustVersion: ms-prod-$(RUST_TOOLCHAIN_VERSION)
    cratesIoFeedOverride: $(cratesIoFeedOverride)
    toolchainFeed: $(toolchainFeed)
  displayName: Install Rust toolchain

- bash: |
    maturin_args=(--release)
    case "$(uname -s)" in
      Linux)
        # Link against Zig's glibc sysroot: the agents ship a newer glibc
        # (Ubuntu 22.04 = 2.35, Azure Linux 3 = 2.38) and a native link would
        # raise the wheel's glibc floor above the tag we claim.
        python -m pip install --upgrade "maturin[zig]"
        maturin_args+=(--zig --target "$(uname -m)-unknown-linux-gnu" --compatibility manylinux_2_28)
        ;;
      Darwin)
        python -m pip install --upgrade maturin
        ;;
      *)
        echo "Unsupported Unix platform: $(uname -s)" >&2
        exit 1
        ;;
    esac
    mkdir -p target/wheels
    cd binar/bindings/python
    maturin build "${maturin_args[@]}" --out ../../../target/wheels
    cd ../../..
    cd paulimer/bindings/python
    maturin build "${maturin_args[@]}" --out ../../../target/wheels
    if [ "$(uname -s)" = "Linux" ]; then
      ls ../../../target/wheels/*manylinux_2_28*.whl
    fi
  displayName: Build Python wheels (Linux/Mac)
  condition: ne( variables['Agent.OS'], 'Windows_NT')

- script: |
    python -m pip install --upgrade maturin
    if not exist target\wheels mkdir target\wheels
    cd binar\bindings\python
    maturin build --release --out ..\..\..\target\wheels
    cd ..\..\..
    cd paulimer\bindings\python
    maturin build --release --out ..\..\..\target\wheels
  displayName: Build Python wheels (Windows)
  condition: eq( variables['Agent.OS'], 'Windows_NT')

- bash: |
    ls -la target/wheels/
  displayName: List built wheels (Linux/Mac)
  condition: ne( variables['Agent.OS'], 'Windows_NT')

- script: |
    dir target\wheels\
  displayName: List built wheels (Windows)
  condition: eq( variables['Agent.OS'], 'Windows_NT')
