parameters:
  - name: platforms
    type: object
  - name: buildAndTest
    type: boolean
    default: true
  # Gate the (slow) deq-runtime wheel build separately from others
  - name: buildDeqRuntime
    type: boolean
    default: true
  # Gate the Pyodide / PyEmscripten (WASM) wheel build for binar/paulimer
  - name: buildWasm
    type: boolean
    default: true

stages:
  - stage: build
    displayName: Build and Test All Crates
    # Run the stage if either the main per-platform jobs or the deq-runtime
    # wheel jobs are requested. The main jobs always exist template-time and
    # carry their own runtime `condition` below, so they get skipped when
    # only deq-runtime is being built.
    condition: or(eq(${{ parameters.buildAndTest }}, true), eq(${{ parameters.buildDeqRuntime }}, true))
    variables:
      PipReportOverrideBehavior: SourceCodeScan
      # glibc floor for the Linux wheels. manylinux_2_28 (AlmaLinux 8) is the
      # oldest policy still supported upstream and covers RHEL 8+, Debian 10+,
      # Ubuntu 18.10+ and Amazon Linux 2023.
      manylinuxTag: manylinux_2_28
    jobs:
    - ${{ each platform in parameters.platforms }}:
        - job: ${{ platform.name }}
          displayName: Build ${{ platform.name }}
          condition: eq(${{ parameters.buildAndTest }}, true)
          ${{ if eq(platform.poolName, 'AcesShared') }}:
            pool:
              name: ${{ platform.poolName }}
              demands:
              - ImageOverride -equals ACES_VM_SharedPool_Sequoia
              os: ${{ platform.os }}
          ${{ elseif and(eq(platform.arch, 'aarch64'), eq(platform.os, 'linux')) }}:
            pool:
              name: ${{ platform.poolName }}
              image: ${{ platform.imageName }}
              os: ${{ platform.os }}
              hostArchitecture: Arm64
          ${{ else }}:
            pool:
              name: ${{ platform.poolName }}
              image: ${{ platform.imageName }}
              os: ${{ platform.os }}
          variables:
            arch: ${{ platform.arch }}
            # Portable RUSTFLAGS shared by test builds AND published wheels so the
            # CPU requirements match. x86_64 picks the x86-64-v3
            # microarchitecture level (Westmere AES, AVX2); aarch64 enables the
            # AES extension that `gxhash` (via `ptr_hash 2`) requires.
            ${{ if eq(platform.arch, 'aarch64') }}:
              rustflagsPortable: "-C target-feature=+aes"
            ${{ else }}:
              rustflagsPortable: "-C target-cpu=x86-64-v3"
          timeoutInMinutes: 120
          templateContext:
            outputs:
            - output: pipelineArtifact
              displayName: "Upload Python wheels"
              condition: succeeded()
              targetPath: $(System.DefaultWorkingDirectory)/target/wheels
              artifactName: ${{ platform.name }}-wheels
            - output: pipelineArtifact
              displayName: "Upload Rust build timings"
              condition: succeededOrFailed()
              targetPath: $(System.DefaultWorkingDirectory)/target/cargo-timings
              artifactName: ${{ platform.name }}-rust-timings
          steps:
          - template: _platform_setup_steps.yaml
            parameters:
              platform: ${{ platform }}

          - script: cargo install cbindgen --locked
            displayName: Install cbindgen

          # the cargo test below requires the shared library to be built first
          - script: cargo build -p deq-decoder-reference-plugin --profile ci-test
            displayName: Build deq-decoder-reference-plugin cdylib
            env:
              RUSTFLAGS: $(rustflagsPortable)

          - script: cargo build -p qodec-c --profile ci-test
            displayName: Build qodec C libraries
            env:
              RUSTFLAGS: $(rustflagsPortable)

          - script: cargo test --workspace --exclude deq-runtime --exclude binar-python --exclude paulimer-bindings --profile ci-test --all-features --timings
            displayName: Build and test all Rust crates (except deq-runtime + Python shims)
            env:
              RUSTFLAGS: $(rustflagsPortable)

          # The Python cdylib crates (binar-python, paulimer-bindings) are
          # intentionally excluded above. They are built once per ABI by
          # `maturin build` below, which produces both the wheel artifact and
          # the cdylib that gets `pip install`-ed for pytest. Doing a
          # separate `cargo build --workspace --all-features` or a separate
          # `maturin develop` step would compile the same cdylib a second
          # (or third) time — costly on Windows ARM64 where release builds
          # use LTO + codegen-units=1.

          # deq-runtime cargo tests are intentionally skipped in CI: this
          # pipeline only ships the Python wheel, and the test suite is
          # expensive (multi-minute coordinator/timing tests).  Local
          # `cargo test` covers it; the maturin build + `import deq_runtime`
          # smoke check (in the separate ${{ platform.name }}_deq_runtime
          # job below) is the only CI verification we need.

          - bash: |
              set -euo pipefail
              mkdir -p target/wheels

              python3 -m venv .venv
              source .venv/bin/activate
              pip install --upgrade pip
              python -m pip install -r requirements-build.txt
              maturin_args=(--release --strip)
              if [[ "$(uname -s)" == "Linux" ]]; then
                export CARGO_ZIGBUILD_PYTHON_PATH="$PWD/tools/zig.py"
                maturin_args+=(--zig --target "$(uname -m)-unknown-linux-gnu" --compatibility $(manylinuxTag))
              fi
              uv python install 3.11 3.14t 3.15.0b4 3.15.0b4+freethreaded
              wheelhouse="$PWD/target/wheels"
              build_and_test() {
                local crate_path="$1"; shift
                local module
                module=$(basename "$crate_path")
                pushd "$crate_path/bindings/python"
                maturin build "${maturin_args[@]}" --interpreter "$test_python" --out "$abi_dir"
                popd
                "$test_python" -m pip install --force-reinstall --no-deps "$abi_dir/$module"-*.whl
                "$test_python" -I -c "import $module; print('$module imported successfully')"
                "$test_python" -I -m pytest "$crate_path/bindings/python/tests/" -v "$@"
              }
              for version in 3.11 3.14t 3.15.0b4; do
                "$(uv python find --managed-python "$version")" -m venv ".venv-$version"
                test_python="$PWD/.venv-$version/bin/python"
                "$test_python" -m pip install --upgrade pip pytest hypothesis more-itertools numpy scipy
                abi_dir="$PWD/target/abi-wheels/$version"
                build_and_test binar
                build_and_test paulimer
                build_and_test deq/deqagram --import-mode=importlib
                maturin build "${maturin_args[@]}" --manifest-path qodec/bindings/python/Cargo.toml --interpreter "$test_python" --out "target/qodec-wheels/$version"
                "$test_python" qodec/tools/check_wheel.py "target/qodec-wheels/$version"
                cp "target/qodec-wheels/$version/"qodec-*.whl "$abi_dir/"
                cp "$abi_dir/"*.whl "$wheelhouse/"
              done
              "$(uv python find --managed-python 3.15.0b4+freethreaded)" -m venv .venv-315t
              .venv-315t/bin/python -m pip install --upgrade pip
              .venv-315t/bin/python -m pip install --no-deps "$wheelhouse/"*-cp315-*.whl
              .venv-315t/bin/python -I -c "import binar, paulimer, deqagram, qodec"
              ls -la target/wheels/
            displayName: Build + test abi3, cp314t, abi3t wheels (Unix)
            condition: ne(variables['Agent.OS'], 'Windows_NT')
            env:
              RUSTFLAGS: $(rustflagsPortable)

          - pwsh: |
              $ErrorActionPreference = "Stop"
              if (!(Test-Path target\wheels)) { New-Item -ItemType Directory -Path target\wheels | Out-Null }

              python -m venv .venv
              .\.venv\Scripts\Activate.ps1
              pip install --upgrade pip
              python -m pip install -r requirements-build.txt
              if ($LASTEXITCODE -ne 0) { throw "Build tool installation failed" }
              uv python install 3.11 3.14t 3.15.0b4 3.15.0b4+freethreaded
              if ($LASTEXITCODE -ne 0) { throw "Interpreter installation failed" }
              $wheelhouse = Join-Path $PWD 'target\wheels'
              function Build-AndTest([string]$cratePath, [string[]]$pytestArgs = @()) {
                $module = Split-Path $cratePath -Leaf
                Push-Location (Join-Path $cratePath 'bindings\python')
                maturin build --release --strip --interpreter $testPython --out $abiDir
                if ($LASTEXITCODE -ne 0) { throw "maturin build failed for $module" }
                Pop-Location
                $wheel = Get-ChildItem -Path $abiDir -Filter "$module-*.whl" | Select-Object -ExpandProperty FullName
                & $testPython -m pip install --force-reinstall --no-deps $wheel
                if ($LASTEXITCODE -ne 0) { throw "Wheel installation failed for $module" }
                & $testPython -I -c "import $module; print('$module imported successfully')"
                if ($LASTEXITCODE -ne 0) { throw "Import failed for $module" }
                & $testPython -I -m pytest (Join-Path $cratePath 'bindings\python\tests') -v @pytestArgs
                if ($LASTEXITCODE -ne 0) { throw "pytest failed for $module" }
              }
              foreach ($version in @('3.11', '3.14t', '3.15.0b4')) {
                $interpreter = uv python find --managed-python $version
                if ($LASTEXITCODE -ne 0) { throw "Interpreter lookup failed" }
                & $interpreter -m venv ".venv-$version"
                if ($LASTEXITCODE -ne 0) { throw "Virtual environment creation failed" }
                $testPython = Join-Path $PWD ".venv-$version\Scripts\python.exe"
                & $testPython -m pip install --upgrade pip pytest hypothesis more-itertools numpy scipy
                if ($LASTEXITCODE -ne 0) { throw "Test dependency installation failed" }
                $abiDir = Join-Path $PWD "target\abi-wheels\$version"
                Build-AndTest 'binar'
                Build-AndTest 'paulimer'
                Build-AndTest 'deq/deqagram' @('--import-mode=importlib')
                maturin build --release --strip --manifest-path qodec/bindings/python/Cargo.toml --interpreter $testPython --out "target/qodec-wheels/$version"
                if ($LASTEXITCODE -ne 0) { throw "maturin build failed for qodec" }
                & $testPython qodec/tools/check_wheel.py "target/qodec-wheels/$version"
                if ($LASTEXITCODE -ne 0) { throw "qodec wheel import check failed" }
                Copy-Item -Path "target/qodec-wheels/$version/qodec-*.whl" -Destination $abiDir
                Copy-Item -Path "$abiDir/*.whl" -Destination $wheelhouse
              }
              $interpreter = uv python find --managed-python 3.15.0b4+freethreaded
              if ($LASTEXITCODE -ne 0) { throw "Free-threaded interpreter lookup failed" }
              & $interpreter -m venv .venv-315t
              if ($LASTEXITCODE -ne 0) { throw "Free-threaded environment creation failed" }
              .\.venv-315t\Scripts\python -m pip install --upgrade pip
              if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
              $wheels = Get-ChildItem $wheelhouse -Filter '*-cp315-*.whl' | Select-Object -ExpandProperty FullName
              .\.venv-315t\Scripts\python -m pip install --no-deps $wheels
              if ($LASTEXITCODE -ne 0) { throw "Free-threaded wheel installation failed" }
              .\.venv-315t\Scripts\python -I -c "import binar, paulimer, deqagram, qodec"
              if ($LASTEXITCODE -ne 0) { throw "Free-threaded import failed" }
              dir target\wheels
            displayName: Build + test abi3, cp314t, abi3t wheels (Windows)
            condition: eq(variables['Agent.OS'], 'Windows_NT')
            env:
              RUSTFLAGS: $(rustflagsPortable)

          - bash: |
              set -euo pipefail
              source .venv/bin/activate
              maturin sdist --manifest-path qodec/bindings/python/Cargo.toml --out target/wheels
            displayName: Build qodec source distribution
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'x86_64'))

          - bash: |
              source .venv/bin/activate
              pip install build
              cd deq
              python -m build --sdist --wheel --outdir ../target/wheels
              cd ..
              ls -la target/wheels/
            displayName: Build deq pure-Python distributions
            condition: and(eq(variables['Agent.OS'], 'Linux'), eq(variables['arch'], 'x86_64'))

        # deq-runtime is built in its own per-platform job so its expensive
        # wheel matrix (stim C++ + LTO) gets its own 120-min budget rather
        # than competing with the binar/paulimer build+test job. Windows
        # ARM64 is skipped because `stim-cxx` vendors MSVC x86-only
        # intrinsics (_umul128 etc) and upstream stim has no win-arm64 wheel.
        - ${{ if and(eq(parameters.buildDeqRuntime, true), not(and(eq(platform.os, 'windows'), eq(platform.arch, 'aarch64')))) }}:
          - job: ${{ platform.name }}_deq_runtime
            displayName: Build deq-runtime ${{ platform.name }}
            dependsOn: []
            ${{ if eq(platform.poolName, 'AcesShared') }}:
              pool:
                name: ${{ platform.poolName }}
                demands:
                - ImageOverride -equals ACES_VM_SharedPool_Sequoia
                os: ${{ platform.os }}
            ${{ elseif and(eq(platform.arch, 'aarch64'), eq(platform.os, 'linux')) }}:
              pool:
                name: ${{ platform.poolName }}
                image: ${{ platform.imageName }}
                os: ${{ platform.os }}
                hostArchitecture: Arm64
            ${{ else }}:
              pool:
                name: ${{ platform.poolName }}
                image: ${{ platform.imageName }}
                os: ${{ platform.os }}
            variables:
              arch: ${{ platform.arch }}
              ${{ if eq(platform.arch, 'aarch64') }}:
                rustflagsPortable: "-C target-feature=+aes"
              ${{ else }}:
                rustflagsPortable: "-C target-cpu=x86-64-v3"
            timeoutInMinutes: 120
            templateContext:
              outputs:
              - output: pipelineArtifact
                displayName: "Upload deq-runtime wheels"
                condition: succeeded()
                targetPath: $(System.DefaultWorkingDirectory)/target/wheels
                artifactName: ${{ platform.name }}-deq-runtime-wheels
            steps:
            - template: _platform_setup_steps.yaml
              parameters:
                platform: ${{ platform }}

            - bash: |
                set -euo pipefail
                mkdir -p target/wheels

                python3 -m venv .venv
                source .venv/bin/activate
                pip install --upgrade pip
                python -m pip install -r requirements-build.txt
                maturin_args=(--release --strip)
                if [[ "$(uname -s)" == "Linux" ]]; then
                  export CARGO_ZIGBUILD_PYTHON_PATH="$PWD/tools/zig.py"
                  maturin_args+=(--zig --target "$(uname -m)-unknown-linux-gnu" --compatibility $(manylinuxTag))
                  export STIM_RS_BUILD_FROM_SOURCE=1
                fi
                uv python install 3.11 3.14t 3.15.0b4 3.15.0b4+freethreaded
                for version in 3.11 3.14t 3.15.0b4; do
                  "$(uv python find --managed-python "$version")" -m venv ".venv-$version"
                  test_python="$PWD/.venv-$version/bin/python"
                  maturin build "${maturin_args[@]}" --manifest-path deq/deq_runtime/Cargo.toml --interpreter "$test_python" --out "target/abi-wheels/$version"
                  "$test_python" -m pip install --upgrade pip
                  "$test_python" -m pip install --no-deps "target/abi-wheels/$version/"*.whl
                  "$test_python" -I -c "import deq_runtime; print('deq_runtime imported successfully')"
                  cp "target/abi-wheels/$version/"*.whl target/wheels/
                done
                "$(uv python find --managed-python 3.15.0b4+freethreaded)" -m venv .venv-315t
                .venv-315t/bin/python -m pip install --upgrade pip
                .venv-315t/bin/python -m pip install --no-deps target/wheels/deq_runtime-*-cp315-*.whl
                .venv-315t/bin/python -I -c "import deq_runtime"
                ls -la target/wheels/
              displayName: Build + import deq-runtime abi3, cp314t, abi3t wheels (Unix)
              condition: ne(variables['Agent.OS'], 'Windows_NT')
              env:
                RUSTFLAGS: $(rustflagsPortable)
                # Workspace `[profile.release]` sets `lto = true` +
                # `codegen-units = 1`, which during the final cdylib link
                # holds the entire crate graph (including stim's vendored
                # C++) in a single rustc process. On the Linux ARM64 1ES
                # agent (~8 GB RAM) this OOMs (SIGKILL on the rustc invoke
                # for `deq-runtime` lib). Use thin LTO + multiple codegen
                # units for the CI wheel build only: peak memory drops
                # roughly proportionally to codegen-units, with a small
                # (~5-10%) runtime penalty.
                CARGO_PROFILE_RELEASE_LTO: "thin"
                CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

            - pwsh: |
                $ErrorActionPreference = "Stop"
                if (!(Test-Path target\wheels)) { New-Item -ItemType Directory -Path target\wheels }

                python -m venv .venv
                .\.venv\Scripts\Activate.ps1
                pip install --upgrade pip
                python -m pip install -r requirements-build.txt
                if ($LASTEXITCODE -ne 0) { throw "Build tool installation failed" }
                uv python install 3.11 3.14t 3.15.0b4 3.15.0b4+freethreaded
                if ($LASTEXITCODE -ne 0) { throw "Interpreter installation failed" }
                foreach ($version in @('3.11', '3.14t', '3.15.0b4', '3.15.0b4+freethreaded')) {
                  $interpreter = uv python find --managed-python $version
                  if ($LASTEXITCODE -ne 0) { throw "Interpreter lookup failed" }
                  & $interpreter -m venv ".venv-$version"
                  if ($LASTEXITCODE -ne 0) { throw "Virtual environment creation failed" }
                  $testPython = Join-Path $PWD ".venv-$version\Scripts\python.exe"
                  $abiDir = "target/abi-wheels/$version"
                  if ($version -eq '3.15.0b4+freethreaded') {
                    $abiDir = 'target/abi-wheels/3.15.0b4'
                  } else {
                    maturin build --release --strip --manifest-path deq/deq_runtime/Cargo.toml --interpreter $testPython --out $abiDir
                    if ($LASTEXITCODE -ne 0) { throw "maturin build failed" }
                    Copy-Item -Path "$abiDir/*.whl" -Destination target/wheels
                  }
                  & $testPython -m pip install --upgrade pip
                  if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
                  $wheel = Get-ChildItem $abiDir -Filter '*.whl' | Select-Object -ExpandProperty FullName
                  & $testPython -m pip install --no-deps $wheel
                  if ($LASTEXITCODE -ne 0) { throw "Wheel installation failed" }
                  & $testPython -I -c "import deq_runtime; print('deq_runtime imported successfully')"
                  if ($LASTEXITCODE -ne 0) { throw "Import failed" }
                }
                dir target\wheels
              displayName: Build + import deq-runtime abi3, cp314t, abi3t wheels (Windows)
              condition: eq(variables['Agent.OS'], 'Windows_NT')
              env:
                RUSTFLAGS: $(rustflagsPortable)
                # See the Unix step for the rationale. Windows agents have
                # more RAM but the same setting also speeds up the build
                # (parallel codegen) on every platform.
                CARGO_PROFILE_RELEASE_LTO: "thin"
                CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    # Pyodide / PyEmscripten (WASM) wheels for binar + paulimer. These are
    # cross-compiled (not per-host), so a single Linux x86_64 job emits both
    # wheels for the pyemscripten_2026_0 ABI (Python 3.14 / Pyodide 314.x).
    # Independent of the native matrix above (dependsOn: []) and gated by
    # `buildWasm`. The older pyemscripten_2025_0 / Python 3.13 release is not
    # targeted: its pinned nightly Rust cannot compile the current sources.
    - ${{ if eq(parameters.buildWasm, true) }}:
      - job: wasm_wheels
        displayName: Build WASM wheels (binar/paulimer)
        dependsOn: []
        pool:
          name: "Azure-Pipelines-DevTools-EO"
          image: "ubuntu-latest"
          os: linux
        timeoutInMinutes: 120
        templateContext:
          outputs:
          - output: pipelineArtifact
            displayName: "Upload WASM wheels"
            condition: succeeded()
            targetPath: $(System.DefaultWorkingDirectory)/target/wheels
            artifactName: wasm-wheels
        steps:
        - template: ../templates/build-wasm-wheels-steps.yaml
          parameters:
            pythonVersion: "3.14"
