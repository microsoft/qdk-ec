[package]
name = "deqagram-python"
version = "0.5.7"
edition = "2024"
publish = false

[lib]
name = "deqagram_python"
crate-type = ["cdylib"]
test = false

[dependencies]
# The pure-Rust parser this crate wraps. Kept out of the parent crate's public
# surface: the Python bindings live here so a plain `cargo build` of deqagram
# links no pyo3.
deqagram = { path = "../.." }
# The stable-ABI floor matches deq's minimum Python.
pyo3 = { version = "0.29", features = ["abi3-py310", "abi3t-py315", "extension-module"] }
