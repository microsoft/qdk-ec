[build-system]
requires = ["setuptools>=64", "grpcio-tools==1.84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deq"
dynamic = []
version = "0.5.7"
description = "deq: quantum error correction decoding system."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Microsoft Corporation" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "arguably>=1.0,<2.0",
    "tqdm",
    # protobuf runtime must be >= the gencode version produced by grpcio-tools
    # at build time. grpcio-tools 1.83.1 emits gencode 7.35.1.
    # See https://protobuf.dev/support/cross-version-runtime-guarantee.
    "protobuf>=7.35.1,<8",
    "grpcio>=1.83.1",
    "grpcio-tools>=1.83.1,<1.85",
    "anywidget",
    "deqagram~=0.5.6",
    "deq-runtime~=0.5.6",
    "mako",
    "stim",
    "networkx",
    "binar>=0.1.2,<0.2",
    "paulimer>=0.2.2,<0.3",
    "qdk>=1.32,<1.33",
]

[project.urls]
Homepage = "https://github.com/microsoft/qdk-ec"
Repository = "https://github.com/microsoft/qdk-ec"
"Bug Tracker" = "https://github.com/microsoft/qdk-ec/issues"

[project.optional-dependencies]
document = [
    "jinja2<3.2",
    "sphinx-rtd-theme",
    "sphinx-jsonschema",
    "nbsphinx",
    "nbconvert",
    "ipykernel<7.4",
    "ipython<8.40.0",
    "jupyter",
    "sympy",
    "holoviews",
    "matplotlib",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-benchmark",
    "pytest-xdist",
    "mypy",
    "black",
    "pylint",
    "types-tqdm",
]
render = ["playwright"]

[project.scripts]
deq = "deq.cli:run"

[tool.setuptools.packages.find]
include = ["deq*"]
exclude = ["deq_runtime*", "deq_visualizer*"]

[tool.setuptools.package-data]
deq = ["py.typed"]
"deq.proto" = ["*.pyi", "proto_src/*.proto"]
"deq.visual" = ["static/*"]
