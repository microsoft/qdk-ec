syntax = "proto3";

package deq.decoder.blackbox_decoder;

import "util.proto";
import "google/protobuf/empty.proto";

/*
 * - A blackbox decoder requires a minimum interface from a decoder: it simply
 *   takes in a decoding hypergraph and a syndrome, and produces a parity factor
 *   as the decoding result. All generic QEC decoders can be wrapped into this
 *   interface.
 */

service BlackBoxDecoder {
  // Report optional request fields this decoder can consume. Advertising
  // multiple features means they may be used together in one decode request.
  rpc GetCapabilities(google.protobuf.Empty) returns (DecoderCapabilities);
  // calling this service is in general inefficient because it has to process
  // the entire decoding hypergraph during runtime. Consider using preloaded
  // decoder instances like the rpc interfaces followed
  rpc Decode(DecodingProblem) returns (ParityFactor);
  // load a decoding hypergraph into the decoder service so that the runtime
  // decoding can simply decode using the existing instances
  rpc LoadHypergraph(DecodingHypergraph) returns (LoadHypergraphResponse);
  // decode using a preloaded hypergraph instance
  rpc DecodeLoaded(LoadedDecodingProblem) returns (ParityFactor);
  // remove all loaded hypergraph instances
  rpc Reset(ResetRequest) returns (google.protobuf.Empty);
}

enum DecoderFeature {
  DECODER_FEATURE_UNSPECIFIED = 0;
  DECODER_FEATURE_REWEIGHTS = 1;
  DECODER_FEATURE_LOSS = 2;
}

message DecoderCapabilities {
  repeated DecoderFeature features = 1;
}

message ResetRequest {
  // by default keep all the hypergraphs intact
  bool reset_hypergraphs = 1;
  // other custom things
  string custom = 200;
}

message DecodingProblem {
  DecodingHypergraph hypergraph = 1;
  deq.util.BitVector syndrome = 2;
  // Optional loss-aware extension. Present only when atom losses are observed
  // for this shot; absent otherwise.
  LossInfo loss = 3;
}

message LoadHypergraphResponse {
  // hypergraph id assigned by the decoder service
  uint64 hid = 1;
}

message LoadedDecodingProblem {
  uint64 hid = 1;
  deq.util.BitVector syndrome = 2;
  // Optional per-shot prior overrides, applied to this decode only. The loaded
  // hypergraph is left unchanged, so a subsequent decode on the same `hid` sees
  // the priors it was loaded with.
  repeated EdgeReweight reweights = 3;
  // Optional loss-aware extension. Present only when atom losses are observed
  // for this shot; absent otherwise.
  LossInfo loss = 4;
}

// Replaces the prior of one hyperedge, addressed by its index in the loaded
// hypergraph. The probability is *assigned*, not combined: it may raise or lower
// the loaded prior. Each edge may appear at most once in a request.
message EdgeReweight {
  uint64 edge = 1;
  double probability = 2;
}

message ParityFactor { repeated uint64 subgraph = 1; }

message DecodingHypergraph {
  uint64 vertex_num = 1;
  repeated Hyperedge hyperedges = 2;
}

message Hyperedge {
  repeated uint64 vertices = 1;
  // we use probability instead of weight here to make it more intuitive
  // and easier to manipulate, e.g., updating the soft information
  double probability = 2;
}

// The observed atom-loss graph for one shot, projected onto the decoding
// problem's own indices. Enforcing exclusivity is a decoder policy, expressed
// through `LossSite.children`. A reweighting strategy can instead flatten the
// sites into ordinary reweighted hyperedges for an unmodified black-box decoder.
message LossInfo {
  // One entry per possible loss site. The runtime has already filtered these to
  // the sites consistent with the observed loss-resolving readouts (herald
  // folding), so per-site heralds are not exposed to the decoder. That is, we
  // guarantee that at least one of the readout is loss and none of them are non-loss
  // (those readouts outside of the decoding window are not considered)
  repeated LossSite sites = 1;
}

message LossSite {
  // Hyperedge indices (into DecodingHypergraph.hyperedges) for the SOURCE
  // generators at the loss location. Along a parent/child chain (one atom) at
  // most one site's source is the true start -- the exclusivity because a qubit
  // cannot lose twice.
  repeated uint64 source_edges = 1;
  // Hyperedge indices for the CONTINUATION generators (the loss propagated
  // forward). Not mutually exclusive; they accompany whichever start reaches
  // them.
  repeated uint64 continuation_edges = 2;
  // Forward parent -> child links (same atom, lost later): indices into
  // LossInfo.sites.
  repeated uint64 children = 3;
  // Declared LOSS_ERROR probability of the loss starting at this site, or 0 for
  // a continuation site fixed by a parent in another gadget.
  double probability = 4;
}
