[package]
name = "qodec"
version = "0.1.1-dev.0"
edition = "2024"
license = "MIT"
authors = ["Microsoft Corporation"]
description = "qodec — a formal model of quantum error correction protocols"
readme = "README.md"
exclude = [".vscode/**"]
repository = "https://github.com/microsoft/qdk-ec"
homepage = "https://github.com/microsoft/qdk-ec"
keywords = ["quantum", "qec", "error-correction", "stabilizer", "codec"]
categories = ["science", "encoding"]

[package.metadata.release]
release = true
shared-version = "qodec"
tag = false

[dependencies]
derive_more = { version = "2.1.1", features = ["from", "display", "as_ref", "error"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
unsafe-libyaml = "0.2"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
jsonschema = { version = "0.29", default-features = false }
proptest = "1.0"
