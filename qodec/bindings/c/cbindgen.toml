# cbindgen configuration for the qodec C header.
#
# The header is checked in at include/qodec.h and a test asserts it stays in
# sync with the Rust source. Regenerate with ./regenerate.sh after changing any
# `extern "C"` signature or status constant.

language = "C"
header = """/*
 * qodec.h - C ABI for qodec.
 *
 * GENERATED by cbindgen from the qodec-c crate. DO NOT EDIT BY HAND.
 * Regenerate with: bindings/c/regenerate.sh
 *
 * Source of truth: bindings/c/src/lib.rs.
 *
 * Load with qodec_load, read the returned Qodec and its fields, then release
 * it with qodec_unload. Treat the root and all reachable storage as read-only.
 *
 * Conventions:
 *   - Ordinary collections are { count, items }; iterate 0 .. count.
 *   - Parity equations, string lists and selection patterns use flat storage
 *     with count + 1 offsets when nonempty. Do not read offsets when empty.
 *   - Strings are borrowed, NUL-terminated const char *. An absent optional
 *     string is NULL; an absent collection is empty.
 *     A string containing NUL fails C projection with QODEC_STATUS_ERROR.
 *   - QodecAction and QodecArgumentValue are tagged unions: switch on tag
 *     and read only the matching member. QodecReference is a flat struct.
 *   - Operands are blocks; parameters are declared classical inputs; arguments
 *     are values supplied to those parameters. QodecInstructionCall separates
 *     operands from arguments; both contain QodecArgument entries.
 *   - QodecParameter.kind describes the declared parameter type, while
 *     QodecArgumentValue.tag selects the supplied value's representation.
 *   - int32_t status codes; QODEC_STATUS_OK (0) is success and negative values
 *     are errors. After a failing status, qodec_last_error() returns a message
 *     for the calling thread, valid until its next recorded error.
 *   - A panic caught in qodec_load returns QODEC_STATUS_PANIC; a panic caught
 *     in qodec_find_gadget returns NULL. Both record an error message.
 *   - Every nested pointer borrows from the root and becomes invalid on unload.
 */"""

include_guard = "QODEC_H"
pragma_once = false
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
usize_is_size_t = true

[export]
include = [
    "QODEC_ABI_VERSION",
    "QODEC_STATUS_OK",
    "QODEC_STATUS_ERROR",
    "QODEC_STATUS_INVALID_ARG",
    "QODEC_STATUS_PANIC",
]

[enum]
prefix_with_name = true
