[package]
name = "qodec-python"
version = "0.1.0"
edition = "2024"
description = "Python bindings for qodec"
license = "MIT"
authors = ["Microsoft Corporation"]
publish = false

[package.metadata.release]
release = true
shared-version = "qodec"
tag = false

[lib]
name = "qodec_python"
crate-type = ["cdylib"]
# An interpreter loads this module, so its behavior is tested from Python.
test = false

[features]
test-support = []

[dependencies]
derive_more = { version = "2.1.1", features = ["display", "error"] }
pyo3 = { version = "0.29", features = ["extension-module", "multiple-pymethods"] }
qodec = { path = "../.." }
serde_yaml = "0.9"
serde_json = "1"
pythonize = "0.29"

[build-dependencies]
pyo3-build-config = "0.29"
