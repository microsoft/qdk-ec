# Logical T, transversally: a physical T-dagger on every one of the 15 qubits.
# The code is triorthogonal (verified offline), so this acts as EXACTLY
# logical T = diag(1, e^{-i pi/4}) on the logical qubit, preserving every stabilizer
# sign. With no measurements it declares no checks; the carry-forward model passes
# all 14 stabilizer signs through unchanged, which is precisely T's action.
t.gadget.yaml:
  circuit:
    instruction_set: stim_t.isa.yaml
    source:
      - Tdg: [0]
      - Tdg: [1]
      - Tdg: [2]
      - Tdg: [3]
      - Tdg: [4]
      - Tdg: [5]
      - Tdg: [6]
      - Tdg: [7]
      - Tdg: [8]
      - Tdg: [9]
      - Tdg: [10]
      - Tdg: [11]
      - Tdg: [12]
      - Tdg: [13]
      - Tdg: [14]
  checks:
    - ["in[0].stabilizers[0]", "out[0].stabilizers[0]"]
    - ["in[0].stabilizers[1]", "out[0].stabilizers[1]"]
    - ["in[0].stabilizers[2]", "out[0].stabilizers[2]"]
    - ["in[0].stabilizers[3]", "out[0].stabilizers[3]"]
    - ["in[0].stabilizers[4]", "out[0].stabilizers[4]"]
    - ["in[0].stabilizers[5]", "out[0].stabilizers[5]"]
    - ["in[0].stabilizers[6]", "out[0].stabilizers[6]"]
    - ["in[0].stabilizers[7]", "out[0].stabilizers[7]"]
    - ["in[0].stabilizers[8]", "out[0].stabilizers[8]"]
    - ["in[0].stabilizers[9]", "out[0].stabilizers[9]"]
