# Chamberland-Beverland, Sec. 3.2 and Fig. 11(a):
# https://arxiv.org/html/1708.02246#S3.SS3
# Reuse syndrome ancilla 15 and flag ancilla 16 for all fourteen stabilizers.
# Flag CNOTs bracket the middle data CNOTs, leaving the first and last outside.
# Per stabilizer i: syndrome = readouts[2i], flag = readouts[2i+1].
