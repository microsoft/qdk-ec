name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests - ${{ matrix.os }} - ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable]
    env:
      # Override the local native default for every Cargo invocation because
      # hosted runners for the same OS can expose different CPU features.
      RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-C target-feature=+aes' || '-C target-cpu=x86-64-v3' }}
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cmake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Install cbindgen
        run: cargo install cbindgen --locked
      
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v2-${{ runner.os }}-cargo-build-target-${{ matrix.toolchain }}-${{ env.RUSTFLAGS }}-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Show toolchain details
        run: |
          rustup --version
          cargo --version
          rustc --version
          rustc --print target-cpus
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Configure Python embedding linker (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python_libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          python_soname="$(python -c 'import sysconfig; print(sysconfig.get_config_var("INSTSONAME") or sysconfig.get_config_var("LDLIBRARY"))')"
          python_link_name="$(python -c 'import sys; print(f"libpython{sys.version_info.major}.{sys.version_info.minor}.so")')"
          test -f "$python_libdir/$python_soname"
          python_link_dir="$RUNNER_TEMP/python-lib"
          mkdir -p "$python_link_dir"
          ln -sf "$python_libdir/$python_soname" "$python_link_dir/$python_link_name"
          echo "LIBRARY_PATH=$python_link_dir${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$python_libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      
      - name: Create Python virtual environment and install dependencies (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          python -m venv qdk_env
          source qdk_env/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio hypothesis more-itertools numpy scipy 'matplotlib>=3.10,<4'
      
      - name: Create Python virtual environment and install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m venv qdk_env
          call qdk_env\Scripts\activate.bat
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio hypothesis more-itertools numpy scipy
      
      - name: Install deq pure-Python package (Linux/Mac)
        if: runner.os != 'Windows'
        working-directory: deq
        run: |
          source ../qdk_env/bin/activate
          pip install -e .

      - name: Install deq pure-Python package (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: deq
        run: |
          call ..\qdk_env\Scripts\activate.bat
          pip install -e .

      - name: Run tests (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          source qdk_env/bin/activate
          # The reference-plugin cdylib is loaded by path in the ABI integration
          # tests and the deq-runtime dynlib test; `cargo test` does not build a
          # cdylib artifact, so build it before any test that loads it.
          cargo build --profile ci-test -p deq-decoder-reference-plugin
          cargo build --profile ci-test -p qodec-c
          cargo test --workspace --exclude deq-runtime --exclude binar-python --exclude paulimer-bindings --exclude deqagram-python --exclude qodec-python --all-features --profile ci-test
          cargo test --package deq-runtime --lib --profile ci-test
          cargo test --package deq-runtime --no-default-features --features cli --lib relay_bp --profile ci-test
          cargo test --package deq-runtime --features "cli simulator mwpm mwpf tesseract python dylib relay-bp" --profile ci-test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call qdk_env\Scripts\activate.bat
          cargo build --profile ci-test -p deq-decoder-reference-plugin
          cargo build --profile ci-test -p qodec-c
          cargo test --workspace --exclude deq-runtime --exclude binar-python --exclude paulimer-bindings --exclude deqagram-python --exclude qodec-python --all-features --profile ci-test
          cargo test --package deq-runtime --lib --profile ci-test
          cargo test --package deq-runtime --no-default-features --features cli --lib relay_bp --profile ci-test
          cargo test --package deq-runtime --features "cli simulator mwpm mwpf tesseract python dylib relay-bp" --profile ci-test

  python:
    name: Python - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUSTFLAGS: ${{ matrix.os == 'macos-latest' && '-C target-feature=+aes' || '-C target-cpu=x86-64-v3' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cmake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Restore cargo registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore cargo index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore cargo build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v2-${{ runner.os }}-cargo-build-target-stable-${{ env.RUSTFLAGS }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Create Python virtual environment and install dependencies (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          python -m venv qdk_env
          source qdk_env/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt pytest pytest-asyncio hypothesis more-itertools numpy scipy 'matplotlib>=3.10,<4'

      - name: Create Python virtual environment and install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m venv qdk_env
          call qdk_env\Scripts\activate.bat
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt pytest pytest-asyncio hypothesis more-itertools numpy scipy

      - name: Build binar Python bindings (Linux/Mac)
        if: runner.os != 'Windows'
        working-directory: binar/bindings/python
        run: |
          source ../../../qdk_env/bin/activate
          maturin develop --profile ci-test

      - name: Build binar Python bindings (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: binar/bindings/python
        run: |
          call ..\..\..\qdk_env\Scripts\activate.bat
          maturin develop --profile ci-test

      - name: Build paulimer Python bindings (Linux/Mac)
        if: runner.os != 'Windows'
        working-directory: paulimer/bindings/python
        run: |
          source ../../../qdk_env/bin/activate
          maturin develop --profile ci-test

      - name: Build paulimer Python bindings (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: paulimer/bindings/python
        run: |
          call ..\..\..\qdk_env\Scripts\activate.bat
          maturin develop --profile ci-test

      - name: Build deqagram Python bindings (Linux/Mac)
        if: runner.os != 'Windows'
        working-directory: deq/deqagram/bindings/python
        run: |
          source ../../../../qdk_env/bin/activate
          maturin develop --profile ci-test
          python -c "import deqagram; print('deqagram imported successfully')"

      - name: Build deqagram Python bindings (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: deq/deqagram/bindings/python
        run: |
          call ..\..\..\..\qdk_env\Scripts\activate.bat
          maturin develop --profile ci-test
          python -c "import deqagram; print('deqagram imported successfully')"

      - name: Build deq-runtime Python bindings (Linux/Mac)
        if: runner.os != 'Windows'
        working-directory: deq/deq_runtime
        run: |
          source ../../qdk_env/bin/activate
          maturin develop --profile ci-test
          python -c "import deq_runtime; print('deq_runtime imported successfully')"

      - name: Build deq-runtime Python bindings (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: deq/deq_runtime
        run: |
          call ..\..\qdk_env\Scripts\activate.bat
          maturin develop --profile ci-test
          python -c "import deq_runtime; print('deq_runtime imported successfully')"

      - name: Install deq pure-Python package (Linux/Mac)
        if: runner.os != 'Windows'
        working-directory: deq
        run: |
          source ../qdk_env/bin/activate
          pip install -e .

      - name: Install deq pure-Python package (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: deq
        run: |
          call ..\qdk_env\Scripts\activate.bat
          pip install -e .

      - name: Check tutorial examples and highlights are up to date
        if: runner.os == 'Linux'
        shell: bash
        working-directory: deq
        run: |
          source ../qdk_env/bin/activate
          python -m pip install -r documents/tutorial/scripts/requirements.txt
          pushd documents/tutorial/scripts
          python run_generators.py
          python highlight_deq.py
          popd
          git diff --exit-code -- documents/tutorial/ || {
            echo "::error::Tutorial examples or highlights are out of date. Run 'python run_generators.py && python highlight_deq.py' in deq/documents/tutorial/scripts and commit the changes."
            exit 1
          }

      - name: Run stubtest for binar (Linux/Mac)
        if: runner.os != 'Windows'
        working-directory: binar/bindings/python
        run: |
          source ../../../qdk_env/bin/activate
          pip install mypy
          python -m mypy.stubtest binar --allowlist stubtest_allowlist.txt

      - name: Run stubtest for binar (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: binar/bindings/python
        run: |
          call ..\..\..\qdk_env\Scripts\activate.bat
          pip install mypy
          python -m mypy.stubtest binar --allowlist stubtest_allowlist.txt

      - name: Run stubtest for paulimer (Linux/Mac)
        if: runner.os != 'Windows'
        working-directory: paulimer/bindings/python
        run: |
          source ../../../qdk_env/bin/activate
          pip install mypy
          python -m mypy.stubtest paulimer --allowlist stubtest_allowlist.txt

      - name: Run stubtest for paulimer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: paulimer/bindings/python
        run: |
          call ..\..\..\qdk_env\Scripts\activate.bat
          pip install mypy
          python -m mypy.stubtest paulimer --allowlist stubtest_allowlist.txt

      - name: Run stubtest for deqagram (Linux/Mac)
        if: runner.os != 'Windows'
        working-directory: deq/deqagram/bindings/python
        run: |
          source ../../../../qdk_env/bin/activate
          pip install mypy
          python -m mypy.stubtest deqagram

      - name: Run stubtest for deqagram (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: deq/deqagram/bindings/python
        run: |
          call ..\..\..\..\qdk_env\Scripts\activate.bat
          pip install mypy
          python -m mypy.stubtest deqagram

      - name: Run Python tests (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          source qdk_env/bin/activate
          # Running from deq/ keeps the installed deq package ahead of the
          # repository's namespace directory named deq.
          (cd deq && pytest tests)
          (cd binar/bindings/python && pytest tests)
          (cd paulimer/bindings/python && pytest tests)
          (cd deq/deqagram/bindings/python && pytest tests)

      - name: Run Python tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call qdk_env\Scripts\activate.bat
          REM Run from deq\ so its source directory does not shadow the installed package.
          pushd deq && pytest tests && popd
          pushd binar\bindings\python && pytest tests && popd
          pushd paulimer\bindings\python && pytest tests && popd
          pushd deq\deqagram\bindings\python && pytest tests && popd

      - name: Check DEQ wheel dependency upgrade and minimums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source qdk_env/bin/activate
          python -m pip wheel --no-deps ./deq --wheel-dir "$RUNNER_TEMP/deq-wheels"
          python -m pip uninstall --yes deq
          python -m pip install "protobuf==6.33.5" "grpcio==1.81.1" "grpcio-tools==1.81.1"
          python -m pip install --upgrade "$RUNNER_TEMP"/deq-wheels/deq-*.whl
          cd "$RUNNER_TEMP"
          deq --help
          python -m pip install "protobuf==7.35.1" "grpcio==1.83.1" "grpcio-tools==1.83.1"
          python -m pip check
          deq --help
          python -I -m pytest --import-mode=importlib \
            "$GITHUB_WORKSPACE/deq/tests/cli/transpile_detectors_test.py" \
            "$GITHUB_WORKSPACE/deq/tests/transpiler/loss_proto_test.py"

  lint:
    name: Lint and build benchmarks
    runs-on: ubuntu-latest
    env:
      # Override the local native default; see the test job.
      RUSTFLAGS: -C target-cpu=x86-64-v3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cmake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check clippy
        run: |
          cargo clippy --profile ci-test --workspace --exclude deq-runtime --all-targets --all-features -- -D clippy::pedantic
          cargo clippy --profile ci-test --package deq-runtime --all-targets --features "cli simulator mwpm mwpf tesseract python dylib relay-bp" -- -D warnings

      - name: Build benchmarks
        run: |
          cargo bench --profile ci-test --manifest-path binar/Cargo.toml --no-run
          cargo bench --profile ci-test --manifest-path paulimer/Cargo.toml --no-run
          cargo bench --profile ci-test --manifest-path deq/deq_runtime/Cargo.toml --no-run

  qodec:
    name: qodec - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        include:
          - python-version: "3.12"
            full: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          components: clippy, rustfmt, llvm-tools-preview
          toolchain: stable

      - name: Cache cargo registry and index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-qodec-registry-${{ hashFiles('**/Cargo.toml') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v2-${{ runner.os }}-qodec-target-${{ matrix.python-version }}-${{ env.RUSTFLAGS }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Install coverage tooling
        if: matrix.full
        run: cargo install cargo-llvm-cov --locked

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create qodec virtual environment
        run: |
          python -m venv qodec_env
          echo "$PWD/qodec_env/bin" >> "$GITHUB_PATH"

      - name: Install qodec check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt mypy pytest packaging PyYAML types-PyYAML ipython "stim>=1.16,<2"
          python -m pip install -r qodec/bindings/python/docs/requirements.txt

      - name: qodec Rust gates
        run: python qodec/tools/check.py rust

      - name: qodec Python binding gates
        run: python qodec/tools/check.py python

      - name: qodec documentation gates
        if: matrix.full
        run: python qodec/tools/check.py docs

      - name: qodec core coverage floor
        if: matrix.full
        run: python qodec/tools/check.py coverage

      - name: qodec packaging gates
        if: matrix.full
        run: python qodec/tools/check.py packaging
